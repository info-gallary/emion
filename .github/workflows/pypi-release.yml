name: Publish PyPI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    env:
      PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libssl-dev \
            git \
            wget \
            cmake \
            libexpat1-dev \
            autoconf \
            automake \
            libtool \
            patchelf

      - name: Build and install ION-DTN
        run: |
          cd ION-DTN
          autoreconf -fi
          ./configure --enable-bpv7
          make -j"$(nproc)"
          sudo make install
          sudo ldconfig

      - name: Install Python packaging tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine auditwheel patchelf

      - name: Build release artifacts
        run: |
          python scripts/release_pypi.py build

      - name: Publish to PyPI
        if: env.PYPI_API_TOKEN != ''
        run: |
          python scripts/release_pypi.py publish --token-env PYPI_API_TOKEN
